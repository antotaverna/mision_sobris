[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mision_sobris"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pygame-ce"]

[project.scripts]
mision_sobris = "mision_sobris.main:main"

[tool.setuptools.packages.find]
where = ["src"]
